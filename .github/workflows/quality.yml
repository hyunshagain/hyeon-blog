name: quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 PR에 새 커밋이 오면 이전 실행을 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: 품질 게이트
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # 여기서 막히면 머지할 수 없다. 이게 자동 발행을 구조적으로 불가능하게 만드는 지점.
      - name: 품질 게이트 8종
        run: npm run gate

      - name: 빌드 (스키마 검증 포함)
        run: npm run build
